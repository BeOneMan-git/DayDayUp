# XcodeGen spec. The CI runs `xcodegen generate` to create DayDayUp.xcodeproj,
# so the Xcode project file never needs to be edited by hand.
name: DayDayUp
options:
  bundleIdPrefix: com.daydayup
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    # The test build (branch "test") overrides these two: its own bundle id = its own data, and another name.
    APP_DISPLAY_NAME: DayDayUp
    CURRENT_PROJECT_VERSION: "2"
targets:
  DayDayUp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: DayDayUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daydayup.app
        PRODUCT_NAME: DayDayUp
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ENABLE_PREVIEWS: "YES"
    info:
      path: DayDayUp/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        "UISupportedInterfaceOrientations":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 跟读和口语练习时录下你的声音。录音只保存在这台 iPad 上，不会上传。
        CFBundleDocumentTypes:
          - CFBundleTypeName: DayDayUp 内容包
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.daydayup.ecopack
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.daydayup.ecopack
            UTTypeDescription: DayDayUp 内容包
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ecopack
              public.mime-type:
                - application/x-ecopack
          - UTTypeIdentifier: com.daydayup.backup
            UTTypeDescription: DayDayUp 备份
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ddubackup
  # UI tap tests on an iPad simulator (ci/ui_tests.sh): the sidebar, List/Form rows and the tab bar must lead
  # somewhere. Simulator only; the device builds never compile this target.
  DayDayUpUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: DayDayUpUITests
    dependencies:
      - target: DayDayUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daydayup.app.uitests
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: DayDayUp
schemes:
  DayDayUp:
    build:
      targets:
        DayDayUp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DayDayUpUITests
    archive:
      config: Release
