# XcodeGen spec. The CI runs `xcodegen generate` to create DayDayUp.xcodeproj,
# so the Xcode project file never needs to be edited by hand.
name: DayDayUp
options:
  bundleIdPrefix: com.daydayup
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  DayDayUp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: DayDayUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daydayup.app
        PRODUCT_NAME: DayDayUp
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ENABLE_PREVIEWS: "YES"
    info:
      path: DayDayUp/Info.plist
      properties:
        CFBundleDisplayName: DayDayUp
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        "UISupportedInterfaceOrientations":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 跟读和口语练习时录下你的声音。录音只保存在这台 iPad 上，不会上传。
        CFBundleDocumentTypes:
          - CFBundleTypeName: DayDayUp 内容包
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.daydayup.ecopack
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.daydayup.ecopack
            UTTypeDescription: DayDayUp 内容包
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ecopack
              public.mime-type:
                - application/x-ecopack
          - UTTypeIdentifier: com.daydayup.backup
            UTTypeDescription: DayDayUp 备份
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ddubackup
  # iPad Simulator host for LogicTests. Not part of the DayDayUp scheme, so the
  # unsigned IPA build does not compile or embed it. Deployment is below iPadOS 26
  # so the tests can still launch if the runner has no iOS 26 simulator runtime.
  LogicTestHost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LogicTests/Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daydayup.logictest.host
        PRODUCT_NAME: LogicTestHost
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: LogicTestHost
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_LSRequiresIPhoneOS: "YES"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ENABLE_PREVIEWS: "NO"
  # Same XCTest sources as LogicTests/Package.swift. Logic sources are compiled
  # into this bundle (they are not a separate module), hosted by LogicTestHost.
  DDULogicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DayDayUp/Logic
      - path: DayDayUp/Models/PackModels.swift
      - path: DayDayUp/Models/PracticeModels.swift
      - path: LogicTests/Tests/DDULogicTests
    dependencies:
      - target: LogicTestHost
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daydayup.logic-tests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LogicTestHost.app/LogicTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_TARGET_NAME: LogicTestHost
        TARGETED_DEVICE_FAMILY: "2"
  # UI walk of the real DayDayUp app. Not part of the DayDayUp scheme, so the
  # unsigned IPA build does not compile or embed it.
  DayDayUpUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
    dependencies:
      - target: DayDayUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daydayup.ui-tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: DayDayUp
        TARGETED_DEVICE_FAMILY: "2"
schemes:
  DayDayUp:
    build:
      targets:
        DayDayUp: all
    run:
      config: Debug
    archive:
      config: Release
  LogicTests:
    build:
      targets:
        LogicTestHost: [test]
        DDULogicTests: [test]
    test:
      config: Debug
      targets:
        - DDULogicTests
    management:
      shared: true
  UIWalk:
    build:
      targets:
        DayDayUp: [test]
        DayDayUpUITests: [test]
    test:
      config: Debug
      targets:
        - DayDayUpUITests
      environmentVariables:
        - variable: SIM_SHOT_DIR
          value: /tmp/ddu-ui-shots
          isEnabled: true
    management:
      shared: true
