# Builds DayDayUp on GitHub's macOS runner.
# - dev branch: compile check only (no ipa, no release).
# - main branch: unsigned DayDayUp.ipa, published as a release. AltServer signs it with your own Apple ID when it installs the app.
# iPad Simulator runs live in test.yml and do not gate this release.
name: Build IPA

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DayDayUp.xcodeproj \
            -scheme DayDayUp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show errors (1-10)
        if: failure()
        run: |
          # Errors become annotations, readable through the public API without a token (max 10 per step).
          grep -E "error:" build.log | awk '!seen[$0]++' > errors.txt || true
          wc -l errors.txt || true
          sed -n '1,10p' errors.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          tail -n 40 build.log || true

      - name: Show errors (11-20)
        if: failure()
        run: sed -n '11,20p' errors.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true

      - name: Show errors (21-30)
        if: failure()
        run: sed -n '21,30p' errors.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true

      - name: Logic tests (FSRS, queue, answer check, CSV, pack diff)
        if: always()
        run: |
          set -o pipefail
          mkdir -p LogicTests/Sources/DDULogic
          cp DayDayUp/Logic/*.swift DayDayUp/Models/PackModels.swift DayDayUp/Models/PracticeModels.swift LogicTests/Sources/DDULogic/
          swift test --package-path LogicTests 2>&1 | tee logic-tests.log | grep -E "error:|failed|passed|Executed" | tail -60

      - name: Show logic test failures
        if: failure()
        run: |
          grep -E "error:|failed" logic-tests.log | head -15 | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          tail -n 80 logic-tests.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            logic-tests.log
          if-no-files-found: ignore

      - name: Read app version
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "App version: $VERSION"

      - name: Package IPA
        if: github.ref == 'refs/heads/main'
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry DayDayUp.ipa Payload
          ls -la DayDayUp.ipa

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: DayDayUp-ipa
          path: DayDayUp.ipa

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DayDayUp ${{ env.APP_VERSION }} · build ${{ github.run_number }}
          body: |
            DayDayUp ${{ env.APP_VERSION }}（未签名）。把 DayDayUp.ipa 下载到电脑的英文路径，再用 AltServer 的 Sideload .ipa 安装，见 docs/INSTALL.md。
          files: DayDayUp.ipa
          make_latest: true
