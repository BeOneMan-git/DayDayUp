# Builds DayDayUp on GitHub's macOS runner.
# - dev branch: compile check only (no ipa, no release).
# - main branch: unsigned DayDayUp.ipa, published as a release. AltServer signs it with your own Apple ID when it installs the app.
# - test branch: the test build (bundle id com.daydayup.app.test, name "DDUTest", so it has its own data on the iPad;
#   the name stays plain ASCII letters: AltServer refuses Chinese app names with "The name for this app is invalid"),
#   published as a pre-release DayDayUp-Test.ipa that is never marked latest; plus an iPad simulator smoke test
#   whose screenshots (original demo content only) are attached to that pre-release.
# - test and fix/* branches: UI tap tests on an iPad simulator in landscape (ci/ui_tests.sh). The gate must
#   pass; results are annotations, and on test also ui-tests.zip on the pre-release.
name: Build IPA

on:
  push:
    branches: [main, dev, test, 'fix/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Choose flavor
        run: |
          if [ "$GITHUB_REF" = "refs/heads/test" ]; then
            echo "BUNDLE_ID=com.daydayup.app.test" >> "$GITHUB_ENV"
            echo "DISPLAY_NAME=DDUTest" >> "$GITHUB_ENV"
            echo "IPA_NAME=DayDayUp-Test.ipa" >> "$GITHUB_ENV"
          else
            echo "BUNDLE_ID=com.daydayup.app" >> "$GITHUB_ENV"
            echo "DISPLAY_NAME=DayDayUp" >> "$GITHUB_ENV"
            echo "IPA_NAME=DayDayUp.ipa" >> "$GITHUB_ENV"
          fi

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DayDayUp.xcodeproj \
            -scheme DayDayUp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            APP_DISPLAY_NAME="$DISPLAY_NAME" \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show errors (1-10)
        if: failure()
        run: |
          # Errors become annotations, readable through the public API without a token (max 10 per step).
          grep -E "error:" build.log | awk '!seen[$0]++' > errors.txt || true
          wc -l errors.txt || true
          sed -n '1,10p' errors.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          tail -n 40 build.log || true

      - name: Show errors (11-20)
        if: failure()
        run: sed -n '11,20p' errors.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true

      - name: Show errors (21-30)
        if: failure()
        run: sed -n '21,30p' errors.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true

      - name: Logic tests (FSRS, queue, answer check, CSV, pack diff)
        if: always()
        run: |
          set -o pipefail
          mkdir -p LogicTests/Sources/DDULogic
          cp DayDayUp/Logic/*.swift DayDayUp/Models/PackModels.swift DayDayUp/Models/PracticeModels.swift LogicTests/Sources/DDULogic/
          swift test --package-path LogicTests 2>&1 | tee logic-tests.log | grep -E "error:|failed|passed|Executed" | tail -60

      - name: Show logic test failures
        if: failure()
        run: |
          grep -E "error:|failed" logic-tests.log | head -15 | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          tail -n 80 logic-tests.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            logic-tests.log
          if-no-files-found: ignore

      - name: Read app version
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "App version: $VERSION"

      - name: Package IPA
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App: $APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "$IPA_NAME" Payload
          ls -la "$IPA_NAME"

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DayDayUp ${{ env.APP_VERSION }} · build ${{ github.run_number }}
          body: |
            DayDayUp ${{ env.APP_VERSION }}（未签名）。把 DayDayUp.ipa 下载到电脑的英文路径，再用 AltServer 的 Sideload .ipa 安装，见 docs/INSTALL.md。
          files: DayDayUp.ipa
          make_latest: true

      - name: Publish test pre-release
        if: github.ref == 'refs/heads/test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: DayDayUp ${{ env.APP_VERSION }} 测试版 · build ${{ github.run_number }}
          body: |
            测试版（未签名）：包名 com.daydayup.app.test，桌面名称“DDUTest”。它和正式版是两个 App，数据完全分开。只用于开发者自己的测试，不是正式发布。simulator-screens.zip 是 iPad 模拟器冒烟测试的截图（只用原创演示内容）。
          files: DayDayUp-Test.ipa
          prerelease: true
          make_latest: false

  simulator:
    # iPad simulator smoke test (test branch only): a Debug simulator build with test hooks, an original demo
    # content pack made on the runner, and screenshots of the main pages in several sizes, themes and text sizes.
    if: github.ref == 'refs/heads/test'
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for the iPad simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project DayDayUp.xcodeproj \
            -scheme DayDayUp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.daydayup.app.test \
            APP_DISPLAY_NAME="DDUTest" \
            build 2>&1 | tee sim-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" sim-build.log

      - name: Make the original demo content pack
        run: |
          set -o pipefail
          python3 --version
          python3 ci/demo_pack.py demo.ecopack 2>&1 | tee demo-pack.log
          cp demo.ecopack simbuild/Build/Products/Debug-iphonesimulator/DayDayUp.app/demo.ecopack

      - name: Package the iPad simulator app for browser testing
        run: |
          APP=simbuild/Build/Products/Debug-iphonesimulator/DayDayUp.app
          test -d "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test "$BUNDLE_ID" = com.daydayup.app.test
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          lipo "$APP/$EXECUTABLE" -verify_arch arm64
          ditto -c -k --sequesterRsrc --keepParent "$APP" DayDayUp-Test-Simulator.zip
          ls -lh DayDayUp-Test-Simulator.zip

      - name: Attach the simulator app to the test pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          files: DayDayUp-Test-Simulator.zip
          prerelease: true
          make_latest: false

      - name: Run on iPad simulators and take screenshots
        run: bash ci/sim_screens.sh simbuild/Build/Products/Debug-iphonesimulator/DayDayUp.app demo.ecopack shots

      - name: Pack screenshots
        if: always()
        run: |
          mkdir -p shots
          cp sim-build.log shots/ 2>/dev/null || true
          cp demo-pack.log shots/ 2>/dev/null || true
          zip -qry simulator-screens.zip shots
          ls -la simulator-screens.zip

      - name: Attach screenshots to the test pre-release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          files: simulator-screens.zip
          prerelease: true
          make_latest: false

  uitest:
    # Taps that must lead somewhere on an iPad simulator in landscape: the sidebar, a 书架 article, a 雅思 prompt,
    # a 设置 row, and the portrait tab bar (test report 2026-09-27, F02/F03/F07/F12/F16). Plus the A/B control:
    # the same taps with 1.0.0's root tap gesture put back, which must lead nowhere (never blocks).
    if: github.ref == 'refs/heads/test' || startsWith(github.ref, 'refs/heads/fix/')
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Make the original demo content pack
        run: python3 ci/demo_pack.py demo.ecopack

      - name: UI tap tests (gate and A/B control)
        run: bash ci/ui_tests.sh demo.ecopack ui-tests

      - name: Pack UI test results
        if: always()
        run: |
          mkdir -p ui-tests
          rm -rf ui-tests/*.xcresult
          zip -qry ui-tests.zip ui-tests
          ls -la ui-tests.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-tests
          path: ui-tests.zip
          if-no-files-found: ignore

      - name: Attach UI test results to the test pre-release
        if: always() && github.ref == 'refs/heads/test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          files: ui-tests.zip
          prerelease: true
          make_latest: false
