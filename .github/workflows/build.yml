# 把这个文件放到仓库里的 .github/workflows/build.yml（在 GitHub 网页上新建文件并粘贴全部内容）。
# Put this file at .github/workflows/build.yml in the repository.
# Builds an unsigned DayDayUp.ipa on GitHub's macOS runner.
# AltStore signs it with your own Apple ID when it installs the app.
name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DayDayUp.xcodeproj \
            -scheme DayDayUp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show errors
        if: failure()
        run: |
          # First errors become annotations, readable through the public API without a token.
          grep -E "error:" build.log | head -10 | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          grep -n -E "error:" build.log | head -80 || true
          tail -n 60 build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry DayDayUp.ipa Payload
          ls -la DayDayUp.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DayDayUp-ipa
          path: DayDayUp.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DayDayUp 0.1 · build ${{ github.run_number }}
          body: |
            V0.1 听读版。在 iPad 上用 Safari 下载 DayDayUp.ipa，再在 AltStore 里点“+”安装。
          files: DayDayUp.ipa
          make_latest: true
